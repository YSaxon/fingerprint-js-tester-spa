<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fingerprint Sealed Result Harness</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
      input, button, select { font-size: 14px; padding: 8px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
      .kv { margin: 6px 0; }
      pre { white-space: pre-wrap; word-break: break-word; background: #f6f7f8; padding: 12px; border-radius: 8px; }
      .warn { color: #7a4b00; }
      .err { color: #b00020; }
      .ok { color: #0b6b0b; }
    </style>
  </head>
  <body>
    <h1>Fingerprint Sealed Result Harness</h1>

    <div class="row">
      <label class="kv">
        Public API key (k):
        <input id="k" size="34" placeholder="PUBLIC_API_KEY" />
      </label>

      <label class="kv">
        Region (region):
        <select id="region">
          <option value="">(auto)</option>
          <option value="us">us</option>
          <option value="eu">eu</option>
          <option value="ap">ap</option>
        </select>
      </label>
    </div>

    <div class="row">
      <label class="kv" style="flex: 1; min-width: 320px">
        Optional POST URL (post):
        <input id="post" style="width: 100%" placeholder="https://your-server.example/fp-capture" />
      </label>

      <label class="kv">
        POST mode:
        <select id="postMode">
          <option value="cors">cors (read response, needs CORS)</option>
          <option value="no-cors">no-cors (fire-and-forget)</option>
        </select>
      </label>
    </div>

    <div class="row">
      <button id="run">Generate sealed_result</button>
      <button id="copyLink">Copy link w- params</button>
      <span id="status"></span>
    </div>

    <h2>Output</h2>
    <div id="meta"></div>
    <pre id="out">(none yet)</pre>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");
      const outEl = $("out");
      const metaEl = $("meta");

      function setStatus(msg, cls = "") {
        statusEl.className = cls;
        statusEl.textContent = msg;
      }

      function getParams() {
        const u = new URL(location.href);
        return {
          k: u.searchParams.get("k") || "",
          region: u.searchParams.get("region") || "",
          post: u.searchParams.get("post") || "",
          postMode: u.searchParams.get("postMode") || "cors",
          autorun: (u.searchParams.get("autorun") || "") === "1",
        };
      }

      function applyParamsToUI(p) {
        $("k").value = p.k;
        $("region").value = p.region;
        $("post").value = p.post;
        $("postMode").value = p.postMode;
      }

      function buildLinkFromUI() {
        const u = new URL(location.href);
        u.searchParams.set("k", $("k").value.trim());
        const r = $("region").value.trim();
        if (r) u.searchParams.set("region", r); else u.searchParams.delete("region");

        const post = $("post").value.trim();
        if (post) u.searchParams.set("post", post); else u.searchParams.delete("post");

        const pm = $("postMode").value;
        if (pm && pm !== "cors") u.searchParams.set("postMode", pm);
        else u.searchParams.delete("postMode");

        return u.toString();
      }

      async function postPayload(postUrl, postMode, payload) {
        // If you choose "cors", the destination must send appropriate CORS headers,
        // otherwise the browser will block the request.
        // "no-cors" will send, but you cannot read the response (opaque).
        const mode = postMode === "no-cors" ? "no-cors" : "cors";

        const res = await fetch(postUrl, {
          method: "POST",
          mode,
          headers: mode === "cors" ? { "Content-Type": "application/json" } : undefined,
          body: mode === "cors" ? JSON.stringify(payload) : JSON.stringify(payload),
        });

        if (mode === "no-cors") return { ok: true, note: "no-cors - request sent (response opaque)" };

        const text = await res.text().catch(() => "");
        return { ok: res.ok, status: res.status, text };
      }

      async function run() {
        try {
          setStatus("Loading agent…");
          outEl.textContent = "(working…)";
          metaEl.textContent = "";

          const apiKey = $("k").value.trim();
          if (!apiKey) {
            setStatus("Missing ?k=PUBLIC_API_KEY", "err");
            outEl.textContent = "Provide the public API key in the URL (?k=...) or the input box.";
            return;
          }

          // CDN install: key is part of the import URL for v4. :contentReference[oaicite:2]{index=2}
          const modUrl = `https://fpjscdn.net/v4/${encodeURIComponent(apiKey)}`;
          const Fingerprint = await import(modUrl);

          // start() returns an agent instance with get(). :contentReference[oaicite:3]{index=3}
          const startOpts = {};
          const region = $("region").value.trim();
          if (region) startOpts.region = region;

          const agent = Fingerprint.start(startOpts);
          setStatus("Calling get()…");

          // get() response includes event_id and (if enabled) sealed_result. :contentReference[oaicite:4]{index=4}
          const result = await agent.get();

          const output = {
            event_id: result?.event_id ?? null,
            visitor_id: result?.visitor_id ?? null,
            sealed_result: result?.sealed_result?.base64() ?? null,
            cache_hit: result?.cache_hit ?? null,
            suspect_score: result?.suspect_score ?? null,
          };

          metaEl.innerHTML = `
            <div class="kv"><b>event_id:</b> ${output.event_id ?? "<i>null</i>"}</div>
            <div class="kv"><b>sealed_result present:</b> ${output.sealed_result ? "<span class='ok'>yes</span>" : "<span class='warn'>no</span>"}</div>
          `;

          outEl.textContent = JSON.stringify(output, null, 2);

          if (!output.sealed_result) {
            setStatus("Got result, but sealed_result is missing", "warn");
            // This usually means Sealed Client Results is not enabled/active for that environment.
            return;
          }

          const postUrl = $("post").value.trim();
          if (postUrl) {
            setStatus("Posting to server…");
            const postMode = $("postMode").value;
            const payload = {
              event_id: output.event_id,
              sealed_result: output.sealed_result,
              // Helpful for correlating test runs:
              collected_at_ms: Date.now(),
              page_url: location.href,
            };
            const resp = await postPayload(postUrl, postMode, payload);
            setStatus(
              resp.ok
                ? (resp.note || `POST ok (${resp.status})`)
                : `POST failed (${resp.status}): ${resp.text || "(no body)"}`,
              resp.ok ? "ok" : "err",
            );
          } else {
            setStatus("Done", "ok");
          }
        } catch (e) {
          setStatus("Error", "err");
          outEl.textContent = String(e?.stack || e);
        }
      }

      $("run").addEventListener("click", run);
      $("copyLink").addEventListener("click", async () => {
        const link = buildLinkFromUI();
        await navigator.clipboard.writeText(link);
        setStatus("Link copied", "ok");
      });

      // Init from URL params
      const p = getParams();
      applyParamsToUI(p);
      if (p.autorun) run();
    </script>
  </body>
</html>
